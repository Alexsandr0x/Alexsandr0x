name: scorecard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar scorecards
        run: python3 scripts/scorecard.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Subir para o GCS
        run: |
          gsutil cp -a public-read scorecard.svg gs://alexsandro-cdn/scorecard.svg
          gsutil cp -a public-read scorecard-side.svg gs://alexsandro-cdn/scorecard-side.svg
          gsutil setmeta -h "Cache-Control:public,max-age=3600" gs://alexsandro-cdn/scorecard.svg gs://alexsandro-cdn/scorecard-side.svg
